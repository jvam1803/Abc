name: Gerar APK (a partir do zip)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o projeto
        run: |
          mkdir projeto
          for z in *.zip; do unzip -q -o "$z" -d projeto; done
          test -n "$(find projeto -name settings.gradle)" || { echo "Nao achei o projeto Android dentro do zip"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar o APK
        run: |
          cd "$(dirname "$(find projeto -name settings.gradle | head -n 1)")"
          gradle assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/saida"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/saida/Bussola.apk"

      - name: Guardar o APK (aba Actions, em Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Bussola-APK
          path: saida/Bussola.apk
          if-no-files-found: error

      - name: Publicar em Releases (mais facil de baixar no celular)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" saida/Bussola.apk \
            --title "Bussola (compilacao ${{ github.run_number }})" \
            --notes "APK de teste, assinado com chave de depuracao."
